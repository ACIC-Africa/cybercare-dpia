# PrivacyCare overlay. docker-compose.yml is Ethyca-authored and is not
# edited; this file adds what PrivacyCare needs on top of it.
#
# Fides' own workers start via `fides worker`, which imports only Fides'
# task modules. PrivacyCare's generation task lives in our package, so it
# needs a worker whose -A points at our entry module.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.privacycare.yml up worker-other worker-privacycare
services:
  # Fix round 1 (coordinator review, MAJOR finding): worker-other's own
  # --exclude-queues list (docker-compose.yml) excludes fides.dsr and five
  # others by name, but NOT fidesplus.privacy_assessments — an omission,
  # not a decision, since that queue didn't exist yet when that list was
  # written. Compose merges a service that appears in both -f files by key
  # (later file wins per-field) rather than replacing the whole service, so
  # this block only needs to override `command`; everything else
  # (image, volumes, healthcheck, env) still comes from docker-compose.yml.
  # Without this, worker-other would happily dequeue and ack a generation
  # message — it has never imported fides.api.privacycare.tasks, so the
  # task is unregistered there — and the message is gone with no error
  # anywhere and no assessments produced. Our task is registered ONLY in
  # fides.api.privacycare.worker (see that module and tasks.py), so any
  # OTHER worker process consuming this queue drops every message it gets
  # silently. Appended to the existing list rather than replacing it, so
  # worker-other's other exclusions are preserved.
  worker-other:
    command: fides worker --reload --reload-dir src --reload-dir data --exclude-queues=fides.dsr,fides.privacy_preferences,fides.privacy_request_exports,fides.privacy_request_ingestion,fidesplus.discovery_monitors_detection,fidesplus.discovery_monitors_classification,fidesplus.discovery_monitors_promotion,fidesplus.privacy_assessments # exclude DSRs, privacy preferences, discovery monitor queues, and PrivacyCare's own generation queue (worked only by worker-privacycare below)

  worker-privacycare:
    extends:
      file: docker-compose.yml
      service: worker-other
    # `celery` bare (via PATH) fails inside this image: its console-script
    # shebang is baked at build time as `#!/build/.venv/bin/python3`, a path
    # that only exists in the build stage, not the runtime one — verified
    # live: `celery --version` in a running container reports
    # "/opt/fides/bin/celery: not found" even though the file exists and is
    # executable, because the shebang interpreter itself is missing. `fides
    # worker` (worker-other's own command) is unaffected because it's a
    # different console script. `python -m celery` sidesteps the shebang
    # entirely, matching the healthcheck below (which already used this
    # form) — the command was the one place still using the bare, broken
    # form, found and fixed only by actually running the container.
    #
    # Task 4 fix (verification found the gap unassigned): this worker is
    # the ONLY process that imports fides.api.privacycare.discovery.execute
    # (see worker.py's own docstring, which already documented this exact
    # two-queue invocation before the command here was updated to match
    # it). api/monitors.py's execute route queues to
    # fidesplus.discovery_monitors_detection, and worker-other above
    # explicitly excludes that queue on the assumption that a dedicated
    # worker consumes it. Before this fix, this worker listened only on
    # fidesplus.privacy_assessments (the DPIA generation queue), so a
    # discovery-detection message landed in a queue nothing consumed: no
    # error anywhere, the scan appears to hang forever. Both queues are
    # listed so this one worker serves both PrivacyCare task families —
    # DPIA generation and discovery-monitor execution.
    command: >
      /opt/fides/bin/python -m celery -A fides.api.privacycare.worker worker
      --loglevel=info
      --queues=fidesplus.privacy_assessments,fidesplus.discovery_monitors_detection
    healthcheck:
      test:
        ["CMD", "/opt/fides/bin/python", "-m", "celery",
         "-A", "fides.api.privacycare.worker", "inspect", "ping"]
      start_period: 60s
      interval: 20s
      timeout: 20s
      retries: 10
    environment:
      FIDES__CELERY__HEALTHCHECK_PORT: "9002"
      # privacycare/llm.py defaults GATEWAY_URL to http://127.0.0.1:8404,
      # which is correct for a process running ON the host and silently wrong
      # for this one: inside a container 127.0.0.1 is the container's OWN
      # loopback, so every completion request was refused. Generation degrades
      # per-question on GatewayUnavailable rather than failing, so a real run
      # over 27 activities reported "complete, 26 of 27" in six seconds while
      # producing 116 genuine record-derived answers and 65 EMPTY ai_analysis
      # ones — the LLM contributed nothing and nothing said so. Found by
      # inspecting the answers, not by any error.
      #
      # The gateway is a service in THIS compose project, on the same
      # network, so address it by service name rather than by any host
      # address. Note the port: it listens on 8400 inside its container and
      # is published to 8404 on the host, so the host-facing 8404 is the
      # wrong number from in here. A bridge-gateway IP (172.17.0.1:8404)
      # also works but is specific to this host's docker networking; the
      # service name travels.
      PRIVACYCARE_GATEWAY_URL: "http://privacycare-gateway:8400"
    expose:
      - 9002
